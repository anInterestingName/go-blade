Name: auth-api
Host: 0.0.0.0
Port: 8888
Mode: dev

Prometheus:
  Host: 0.0.0.0
  Port: 9092
  Path: /metrics

Telemetry:
  Name: service-auth
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

RpcServer:
  ListenOn: 0.0.0.0:9001
  Timeout: 5000

Auth:
  AccessSecret: blade-secret-key-for-test-32bytes
  AccessExpire: 86400
  RefreshExpire: 604800
  Issuer: blade

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""
  Tls: false
