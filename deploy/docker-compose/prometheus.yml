global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'service-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000', 'host.docker.internal:8080', 'host.docker.internal:9091']
        labels:
          service: 'gateway'

  - job_name: 'service-auth'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8001', 'host.docker.internal:8888', 'host.docker.internal:9092']
        labels:
          service: 'auth'

  - job_name: 'service-system'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8002', 'host.docker.internal:8889', 'host.docker.internal:9093']
        labels:
          service: 'system'

  - job_name: 'service-desk'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8003', 'host.docker.internal:8890', 'host.docker.internal:9094']
        labels:
          service: 'desk'
