# =============================================================================
# go-blade 核心微服务 Kubernetes 生产级 Deployment 与 Service 编排清单
# 对接标准 K8s Liveness (/healthz/live)、Readiness (/healthz/ready) 与 Prometheus (/metrics)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-gateway
  namespace: go-blade
  labels:
    app: service-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-gateway
  template:
    metadata:
      labels:
        app: service-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: service-gateway
          image: go-blade/service-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["-f", "/app/etc/gateway.yaml"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: blade-common-env
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: service-gateway
  namespace: go-blade
spec:
  type: ClusterIP
  selector:
    app: service-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
