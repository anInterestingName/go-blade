apiVersion: v1
kind: Namespace
metadata:
  name: go-blade
  labels:
    app.kubernetes.io/part-of: go-blade
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blade-common-env
  namespace: go-blade
data:
  TZ: "Asia/Shanghai"
  NACOS_HOST: "blade-nacos.go-blade.svc.cluster.local"
  NACOS_PORT: "8848"
  MYSQL_HOST: "blade-mysql.go-blade.svc.cluster.local"
  REDIS_HOST: "blade-redis.go-blade.svc.cluster.local:6379"
  KAFKA_BROKERS: "blade-kafka.go-blade.svc.cluster.local:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://blade-jaeger.go-blade.svc.cluster.local:4318"
